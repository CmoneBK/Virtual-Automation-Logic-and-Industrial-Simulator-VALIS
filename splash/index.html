<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Splash</title>
    <style>
      body, html {
        height: 100%;
        width: 100%;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        overscroll-behavior: none; 
        overflow: hidden; 
      }
      
      canvas {
        width: 100%;
        height: 100%;
      }

      #ui-container {
        position: fixed; 
        top: 0; 
        left: 0; 
        width: 300px; 
        margin: 20px; 
      }

      #number-container {
        position: fixed; 
        top: 0; 
        right: 0; 
        margin: 20px;
        margin-right: 10px;
        font-size: 15px;
        width: 270px;
      }

      #debug-info {
        position: fixed; 
      }
      #howto-container {
        position: fixed; 
        bottom: 0; 
        left: 0; 
        width: 300px; 
        margin: 20px; 
        font-size: small;
      }
      #github-link {
        position:fixed;
        bottom: 0;
        right: 0;
      }
      .github-icon {
        position: absolute;
        bottom: 10px;
        right: 20px;
        font-size: 40px;
        color: black; 
      }
      * {
        user-select: none; 
      }
    </style>
  </head>
  <body>
    <div id="ui-container">
      <div style="display: flex; flex-direction: column;">
        <label>
          <input type="checkbox" id="particle"> Particles
        </label>
      </div>
      <div id="slider-container">
        <label for="slider">Box Width:</label>
        <input type="range" id="slider" min="0" max="100" value="100" />
        <span id="slider-value"></span>
      </div>
    </div>
    <div id="howto-container">
      <div> <b>Drag</b> to move camera </div>
      <div> <b>Scroll</b> to zoom in and out </div>
      <div> <b>Press P</b> to pause the simulation </div>
    </div>
    <div id="debug-info">
      <span id="error-reason">loading now...(won't take longer than 10 seconds I guess)</span>
    </div>
    <a href="https://github.com/matsuoka-601/Splash" 
      class="github-icon" 
      target="_blank" 
      rel="noopener noreferrer">
        <!-- GitHub-Zeichen als eingebettetes SVG statt Font Awesome vom CDN:
             die Seite stellt keine Verbindung zu fremden Rechnern her -->
        <svg width="1em" height="1em" viewBox="0 0 16 16" fill="currentColor" aria-label="GitHub"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
    <canvas id="fluidCanvas"></canvas>
    <script type="module" src="main.ts"></script>
  </body>
</html>
